name: Feature request
description: Suggest an idea or improvement
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the UX/API you have in mind. Screenshots or mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New OpenRPC feature (schema field, method structure)
        - Playground improvement
        - Batch improvement
        - UI / UX
        - i18n / new language
        - Build / packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, prior art in other tools, references to the OpenRPC spec.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: |
        This project ships a single self-contained HTML file and prefers no new
        runtime dependencies.
      options:
        - label: My proposal can be implemented without new runtime dependencies
          required: false
        - label: My proposal can be implemented without a UI framework
          required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
