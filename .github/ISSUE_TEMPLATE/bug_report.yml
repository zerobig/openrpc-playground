name: Bug report
description: Something doesn't work as expected
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **For security issues, do not open an issue — see [SECURITY.md](../SECURITY.md).**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load schema from ...
        2. Click method ...
        3. Fill params with ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Schema URL or minimal JSON snippet
      description: |
        A URL to an `openrpc.json`, or — preferably — the smallest schema snippet
        that reproduces the issue. Redact secrets and internal hostnames.
      render: json
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 129, Firefox 130, Safari 17.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 14, Windows 11, Ubuntu 24.04
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console / network errors
      description: Paste relevant messages from DevTools.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: method-kind
    attributes:
      label: Which part of the app is affected?
      multiple: true
      options:
        - Schema loading
        - Tree / search
        - Method detail
        - Type detail
        - Playground (single request)
        - Batch
        - Authorization
        - i18n / language
        - Build / packaging
        - Documentation
        - Other
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
